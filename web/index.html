<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CTF Catalog By Dracula</title>
<style>
 /* Monochrome bento dashboard with a category sidebar */
 :root{--bg:#0a0a0b;--side:#0d0d0f;--card:#141416;--card2:#1c1c20;--line:#282a2e;--line2:#3a3c42;
   --tx:#f5f5f6;--dim:#9a9ba3;--faint:#6c6d76;--btn:#ededed;--btn-tx:#0a0a0b;
   --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
 *{box-sizing:border-box}html,body{height:100%}
 body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--sans);
   display:grid;grid-template-columns:240px 1fr;grid-template-rows:100vh;overflow:hidden}
 /* sidebar */
 aside{background:var(--side);border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
 .brand{padding:20px;font-size:16px;font-weight:700;letter-spacing:.2px;border-bottom:1px solid var(--line)}
 .brand small{display:block;color:var(--faint);font-weight:400;font-size:12px;margin-top:3px}
 nav{padding:10px}
 .navlbl{color:var(--faint);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:12px 10px 6px}
 .cat{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;
   background:0;border:0;color:var(--dim);padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;transition:.13s}
 .cat:hover{background:var(--card);color:var(--tx)}
 .cat.on{background:var(--card2);color:var(--tx);font-weight:600}
 .cat .n{color:var(--faint);font-size:11.5px}.cat.on .n{color:var(--dim)}
 /* main */
 main{overflow-y:auto}
 .top{position:sticky;top:0;z-index:4;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
   padding:15px 26px;border-bottom:1px solid var(--line);background:rgba(10,10,11,.86);backdrop-filter:blur(9px)}
 .top h1{margin:0 auto 0 0;font-size:16px;font-weight:650}
 .pills{display:inline-flex;gap:6px}
 .pill{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:7px 13px;font:600 12.5px var(--sans);cursor:pointer;transition:.13s}
 .pill:hover{border-color:var(--line2);color:var(--tx)}.pill.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
 select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font:13px var(--sans);cursor:pointer}
 select:hover{border-color:var(--line2)}select:focus{outline:0;border-color:#55575e}
 .count{color:var(--faint);font-size:12.5px}
 .addbtn{background:var(--btn);color:var(--btn-tx);border:0;border-radius:8px;padding:8px 15px;font:700 13px var(--sans);cursor:pointer;transition:.15s}.addbtn:hover{background:#fff}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:22px 26px 48px}
 .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:11px;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
 .box:hover{border-color:var(--line2);background:var(--card2);transform:translateY(-2px)}
 .cattag{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--faint)}
 .box h2{margin:0;font-size:17px;font-weight:600;line-height:1.32;color:var(--tx)}
 .badge{align-self:flex-start;font-size:10.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:3px 9px}
 .skills{display:flex;gap:6px;flex-wrap:wrap}.skill{font-size:11px;color:var(--dim);background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:2px 9px}
 .src{color:var(--faint);font-size:12px}.src b{color:var(--dim);font-weight:600}
 .btns{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
 .act{border-radius:8px;padding:8px 14px;font:13px var(--sans);cursor:pointer;text-decoration:none;background:transparent;color:var(--dim);border:1px solid var(--line);transition:.15s}
 .act:hover{color:var(--tx);border-color:var(--line2)}
 .act.primary{background:var(--btn);color:var(--btn-tx);border-color:var(--btn);font-weight:700}.act.primary:hover{background:#fff}
 .empty{grid-column:1/-1;color:var(--faint);text-align:center;padding:74px}
 ::-webkit-scrollbar{width:11px}::-webkit-scrollbar-thumb{background:#2a2a2e;border-radius:8px;border:2px solid var(--bg)}::-webkit-scrollbar-thumb:hover{background:#3a3c42}
 @media (max-width:820px){
   body{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;overflow:auto}
   aside{border-right:0;border-bottom:1px solid var(--line)}
   nav{display:flex;gap:6px;overflow-x:auto}.navlbl{display:none}.cat{width:auto;white-space:nowrap;border:1px solid var(--line)}.cat .n{display:none}
   main{overflow:visible}
 }
</style></head>
<body>
 <aside><div class="brand">CTF Catalog<small>By Dracula</small></div><nav id="cats"></nav></aside>
 <main>
  <div class="top"><h1 id="heading">All challenges</h1>
   <span class="pills" id="diffs"></span><select id="ctf"></select>
   <span class="count" id="count"></span><button id="addbtn" class="addbtn">+ Add recipe</button></div>
  <div class="grid" id="grid"></div>
 </main>
<script>
 window.onCatalog=function(d){
  var c=CATALOG.catCounts(),nav=document.getElementById("cats");
  var mk=function(v,l,n){return '<button class="cat" data-v="'+CATALOG.esc(v)+'"><span>'+CATALOG.esc(l)+'</span><span class="n">'+n+'</span></button>';};
  nav.innerHTML='<div class="navlbl">Category</div>'+mk("","All",d.length)+
    CATALOG.FIXED_CATS.map(function(x){return mk(x,x,c[x]||0);}).join("");
  nav.querySelectorAll(".cat").forEach(function(b){b.onclick=function(){CATALOG.set("cat",b.dataset.v);hi();};});
  var dm=document.getElementById("diffs");
  dm.innerHTML='<button class="pill on" data-d="">All</button>'+["easy","medium","hard"].map(function(x){return '<button class="pill" data-d="'+x+'">'+x+'</button>';}).join("");
  dm.querySelectorAll(".pill").forEach(function(b){b.onclick=function(){CATALOG.set("diff",b.dataset.d);dm.querySelectorAll(".pill").forEach(function(p){p.classList.toggle("on",p.dataset.d===b.dataset.d);});};});
  var s=document.getElementById("ctf");
  s.innerHTML='<option value="">All CTFs</option>'+CATALOG.ctfs().map(function(x){return '<option>'+CATALOG.esc(x)+'</option>';}).join("");
  s.onchange=function(){CATALOG.set("ctf",s.value);};
  hi();
 };
 function hi(){document.querySelectorAll("#cats .cat").forEach(function(b){b.classList.toggle("on",b.dataset.v===CATALOG.state.cat);});}
 window.paint=function(rows){
  document.getElementById("heading").textContent=CATALOG.state.cat||"All challenges";
  document.getElementById("count").textContent=rows.length+(rows.length===1?" recipe":" recipes");
  var g=document.getElementById("grid");
  g.innerHTML=rows.length?rows.map(function(r){return CATALOG.cardHTML(r);}).join(""):"<div class='empty'>No recipes here.</div>";
  CATALOG.wire(g);
 };
 document.getElementById("addbtn").onclick=function(){CATALOG.addRecipeModal();};
</script>
<script src="core.js"></script></body></html>
