<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>CTF Catalog By Dracula</title>
<style>
 :root{--bg:#282a36;--card:#343746;--card2:#3c3f52;--line:#44475a;--tx:#f8f8f2;--dim:#a4abd0;
   --purple:#bd93f9;--pink:#ff79c6;--cyan:#8be9fd;--green:#50fa7b;--yellow:#f1fa8c;--orange:#ffb86c;--red:#ff5555;--comment:#6272a4}
 *{box-sizing:border-box}html,body{height:100%}
 body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,Segoe UI,Roboto,Arial,sans-serif;display:flex;flex-direction:column;height:100vh}
 .bar{border-bottom:1px solid var(--line);padding:18px 28px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:rgba(40,42,54,.92);backdrop-filter:blur(8px);z-index:4}
 .bar h1{margin:0 auto 0 0;font-size:22px;font-weight:800}.bar h1 b{color:var(--purple)}.bar h1 i{color:var(--pink);font-style:normal}
 select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
 select:focus{outline:0;border-color:var(--purple);box-shadow:0 0 0 3px rgba(189,147,249,.25)}
 .pill{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:6px 14px;font-size:12.5px;cursor:pointer;font-weight:600}.pill.on{background:var(--purple);color:#282a36;border-color:var(--purple)}
 .count{color:var(--comment);font-size:12.5px}
 main{overflow-y:auto;flex:1}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px;padding:22px 28px 46px}
 .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:.18s}
 .box:hover{transform:translateY(-3px);border-color:var(--purple);box-shadow:0 16px 34px -14px rgba(189,147,249,.4)}
 .cattag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--pink)}
 .box h2{margin:0;font-size:17.5px;font-weight:700;line-height:1.3;color:var(--tx)}
 .badge{align-self:flex-start;display:inline-flex;gap:7px;align-items:center;font-size:11px;font-weight:700;text-transform:lowercase;padding:3px 12px;border-radius:999px;border:0;color:#282a36}
 .badge.easy{background:var(--green)}.badge.medium{background:var(--orange)}.badge.hard{background:var(--red)}
 .skills{display:flex;gap:6px;flex-wrap:wrap}.skill{font-size:11px;color:var(--cyan);background:rgba(139,233,253,.08);border:1px solid rgba(139,233,253,.25);border-radius:999px;padding:2px 10px}
 .src{color:var(--comment);font-size:11.5px}.src b{color:var(--tx)}
 .btns{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
 .act{border-radius:9px;padding:7px 13px;font-size:12.5px;cursor:pointer;text-decoration:none;background:transparent;color:var(--dim);border:1px solid var(--line);transition:.15s}
 .act:hover{color:var(--purple);border-color:var(--purple)}.act.primary{background:var(--purple);color:#282a36;border-color:var(--purple);font-weight:700}.act.primary:hover{background:var(--pink);border-color:var(--pink)}
 .empty{grid-column:1/-1;color:var(--comment);text-align:center;padding:70px}
</style></head>
<body>
 <div class="bar"><h1><b>#</b> CTF Catalog <i>By Dracula</i></h1>
  <select id="cat"></select><select id="ctf"></select><span id="diffs"></span><span class="count" id="count"></span></div>
 <main><div class="grid" id="grid"></div></main>
<script>
 window.onCatalog=function(d){
  var c=CATALOG.catCounts(),sc=document.getElementById("cat");
  sc.innerHTML='<option value="">category: all</option>'+CATALOG.FIXED_CATS.filter(function(x){return c[x];}).map(function(x){return '<option>'+CATALOG.esc(x)+'</option>';}).join("");sc.onchange=function(){CATALOG.set("cat",sc.value);};
  var st=document.getElementById("ctf");st.innerHTML='<option value="">ctf: all</option>'+CATALOG.ctfs().map(function(x){return '<option>'+CATALOG.esc(x)+'</option>';}).join("");st.onchange=function(){CATALOG.set("ctf",st.value);};
  var dm=document.getElementById("diffs");dm.innerHTML='<button class="pill on" data-d="">All</button>'+["easy","medium","hard"].map(function(x){return '<button class="pill" data-d="'+x+'">'+x+'</button>';}).join("");
  dm.querySelectorAll(".pill").forEach(function(b){b.onclick=function(){CATALOG.set("diff",b.dataset.d);dm.querySelectorAll(".pill").forEach(function(p){p.classList.toggle("on",p.dataset.d===b.dataset.d);});};});
 };
 window.paint=function(rows){document.getElementById("count").textContent=rows.length+" recipes";var g=document.getElementById("grid");g.innerHTML=rows.length?rows.map(function(r){return CATALOG.cardHTML(r);}).join(""):"<div class='empty'>No recipes here.</div>";CATALOG.wire(g);};
</script><script src="core.js"></script></body></html>
