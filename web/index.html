<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CTF Catalog By Dracula</title>
<style>
 /* Terminal palette + editorial serif fonts */
 :root{--bg:#05080a;--card:#0b1012;--card2:#0f1618;--line:#2c5342;--tx:#cdefd8;--dim:#5f8a6f;
   --a:#39ff9a;--e:#7ee0a0;--m:#e6d15a;--h:#ff7a7a;
   --serif:Georgia,"Times New Roman","DejaVu Serif","Nimbus Roman",serif;
   --mono:ui-monospace,"DejaVu Sans Mono","Courier New",monospace}
 *{box-sizing:border-box}html,body{height:100%}
 body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 var(--serif);
   display:flex;flex-direction:column;height:100vh}
 .hdr{padding:22px 26px 6px}
 .hdr h1{margin:0;font-size:30px;font-weight:400;letter-spacing:.3px}
 .hdr h1::before{content:"# ";color:var(--a);font-family:var(--mono);font-size:24px}
 .hdr .by{color:var(--a);font-style:italic}
 .bar{padding:12px 26px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
   border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:4}
 .prompt{color:var(--dim);font-family:var(--mono);font-size:13px}
 .prompt::before{content:"catalog@dracula:~$ ";color:var(--a)}
 select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:5px;
   padding:7px 10px;font:14px var(--serif)}
 select:focus{outline:1px solid var(--a)}
 .count{color:var(--dim);font-family:var(--mono);font-size:12.5px;margin-left:auto}
 main{overflow-y:auto;flex:1;padding:20px 26px 44px}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
 .box{background:var(--card);border:1px solid #356b52;border-radius:7px;padding:16px;cursor:pointer;
   display:flex;flex-direction:column;gap:9px}
 .box:hover{border-color:var(--a)}
 .cattag{font-family:var(--mono);font-size:11px;color:var(--a);letter-spacing:.3px}
 .cattag::before{content:"# "}
 .box h2{margin:0;font-size:19px;font-weight:400;line-height:1.3}
 .box h2::before{content:"> ";color:var(--a);font-family:var(--mono)}
 .badge{align-self:flex-start;font-family:var(--mono);font-size:11px;border:1px solid var(--line);
   border-radius:3px;padding:1px 8px;color:var(--dim);text-transform:lowercase}
 .badge.easy{color:var(--e)}.badge.medium{color:var(--m)}.badge.hard{color:var(--h)}
 .skills{color:var(--dim);font-size:13.5px;font-style:italic}
 .src{color:var(--dim);font-size:12.5px}.src b{color:var(--tx);font-style:italic}
 .btns{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
 .act{background:var(--card2);color:var(--a);border:1px solid var(--line);border-radius:5px;
   padding:7px 12px;font:13px var(--mono);cursor:pointer;text-decoration:none}
 .act:hover{background:var(--a);color:var(--bg)}
 .empty{grid-column:1/-1;color:var(--dim);text-align:center;padding:70px;font-style:italic}
 .cm-md h2{font-family:var(--serif)}
</style></head>
<body>
 <header class="hdr"><h1>CTF Catalog <span class="by">By Dracula</span></h1></header>
 <div class="bar"><span class="prompt"></span>
   <select id="cat"></select><select id="ctf"></select><select id="diff"></select>
   <span class="count" id="count"></span></div>
 <main><div class="grid" id="grid"></div></main>
<script>
 window.onCatalog=function(d){
   var c=CATALOG.catCounts(), cat=document.getElementById("cat");
   cat.innerHTML='<option value="">category: all</option>'+
     CATALOG.FIXED_CATS.filter(function(x){return c[x];}).map(function(x){return '<option>'+CATALOG.esc(x)+'</option>';}).join("");
   cat.onchange=function(){CATALOG.set("cat",cat.value);};
   var ctf=document.getElementById("ctf");
   ctf.innerHTML='<option value="">ctf: all</option>'+CATALOG.ctfs().map(function(x){return '<option>'+CATALOG.esc(x)+'</option>';}).join("");
   ctf.onchange=function(){CATALOG.set("ctf",ctf.value);};
   var df=document.getElementById("diff");
   df.innerHTML='<option value="">difficulty: all</option><option>easy</option><option>medium</option><option>hard</option>';
   df.onchange=function(){CATALOG.set("diff",df.value);};
 };
 window.paint=function(rows){
   document.getElementById("count").textContent=rows.length+" match"+(rows.length===1?"":"es");
   var g=document.getElementById("grid");
   g.innerHTML=rows.length?rows.map(function(r){return CATALOG.cardHTML(r);}).join(""):"<div class='empty'>-- no matches --</div>";
   CATALOG.wire(g);
 };
</script>
<script src="core.js"></script></body></html>
