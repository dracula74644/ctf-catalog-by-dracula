<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CTF Challenge Catalog</title>
<style>
  :root{--bg:#0f1216;--card:#171c22;--card2:#1c232b;--line:#28313b;--tx:#e8eef4;--dim:#93a1b0;
        --a:#5db2a6;--e:#7ec07a;--m:#e0b25a;--h:#e07a7a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,Segoe UI,Roboto,Arial,sans-serif}
  header{padding:26px 24px 8px;max-width:1200px;margin:0 auto}
  h1{margin:0;font-size:24px} .count{color:var(--dim);font-size:13px}
  .bar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 24px;z-index:5}
  .bar .row{max-width:1200px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  select{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px}
  main{max-width:1200px;margin:0 auto;padding:18px 24px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
  .card h2{margin:0;font-size:16.5px}
  .cat{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--a)}
  .badges{display:flex;gap:6px;flex-wrap:wrap}
  .b{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .b.easy{color:var(--e)} .b.medium{color:var(--m)} .b.hard{color:var(--h)}
  .skills{color:var(--dim);font-size:12.5px}
  .btns{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
  button.act,a.act{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:12.5px;cursor:pointer;text-decoration:none}
  button.act:hover,a.act:hover{border-color:var(--a)}
  .empty{grid-column:1/-1;color:var(--dim);text-align:center;padding:50px}
  dialog{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:14px;max-width:760px;width:92%;padding:0}
  dialog::backdrop{background:rgba(4,6,9,.7)}
  .dh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card2)}
  .dh h2{margin:0;font-size:19px} .dbody{padding:8px 20px 20px}
  .dbody h2{font-size:15px;color:var(--a);margin:18px 0 6px} .dbody h3{font-size:14px;margin:14px 0 4px}
  .dbody code{background:#0e1216;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12.5px}
  .dbody ul,.dbody ol{margin:6px 0 6px 20px;padding:0} .dbody li{margin:2px 0}
  .x{background:0;border:0;color:var(--dim);font-size:24px;cursor:pointer;line-height:1}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--a);color:#0c0f12;font-weight:700;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}
</style></head>
<body>
  <header><h1>CTF Challenge Catalog</h1><div class="count" id="count"></div></header>
  <div class="bar"><div class="row">
    <select id="f-cat">
      <option value="">Category: all</option>
      <option>Reverse Engineering</option>
      <option>Mobile Security</option>
      <option>Digital Forensics</option>
      <option>Web Application Security</option>
      <option>Cryptography</option>
      <option>Network Security</option>
      <option>Secure Coding</option>
      <option>Exploitation</option>
      <option>AI/ML</option>
    </select>
    <select id="f-diff">
      <option value="">Difficulty: all</option>
      <option value="easy">easy</option>
      <option value="medium">medium</option>
      <option value="hard">hard</option>
    </select>
  </div></div>
  <main id="grid"></main>
  <dialog id="modal"><div class="dh"><h2 id="m-title"></h2><button class="x" id="m-close">&times;</button></div>
    <div class="dbody" id="m-body"></div></dialog>
  <div class="toast" id="toast"></div>
<script>
const DIFF={easy:0,medium:1,hard:2};
let DATA=[];
const el=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function md(t){
  const lines=t.split("\n"); let out=[],list=null;
  const inline=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  const closeList=()=>{ if(list){out.push(list==="ul"?"</ul>":"</ol>");list=null;} };
  for(let ln of lines){
    if(/^## /.test(ln)){closeList();out.push("<h2>"+inline(ln.slice(3))+"</h2>");continue;}
    if(/^### /.test(ln)){closeList();out.push("<h3>"+inline(ln.slice(4))+"</h3>");continue;}
    let m;
    if(m=ln.match(/^\s*[-*]\s+(.*)/)){ if(list!=="ul"){closeList();out.push("<ul>");list="ul";} out.push("<li>"+inline(m[1])+"</li>");continue;}
    if(m=ln.match(/^\s*\d+\.\s+(.*)/)){ if(list!=="ol"){closeList();out.push("<ol>");list="ol";} out.push("<li>"+inline(m[1])+"</li>");continue;}
    if(ln.trim()===""){closeList();continue;}
    closeList(); out.push("<p>"+inline(ln)+"</p>");
  }
  closeList(); return out.join("\n");
}
function promptFor(r){
  return `Add this challenge to the CTF I'm building on the CTF blueprint, themed to `+
`<DESCRIBE YOUR CTF'S STORY HERE>.\nUse ONLY the mechanic below. Invent every name, filename, `+
`hostname, account and story fresh for this CTF — never carry over any old name or code. Mint a `+
`fresh flag plus an 8-char prefix/postfix and place the flag and access key per the "What to plant" `+
`section (different spots). Wire it as a normal blueprint challenge, then run challenge-tester.\n\n`+
`--- RECIPE: ${r.title} (${r.category}, ${r.difficulty}) ---\n${r.body}\n`;
}
function toast(msg){const t=el("toast");t.textContent=msg;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1400);}
function copy(text,msg){navigator.clipboard.writeText(text).then(()=>toast(msg||"copied")).catch(()=>toast("copy failed"));}
function openModal(r){
  el("m-title").textContent=r.title;
  el("m-body").innerHTML=
    `<div class="cat">${esc(r.category)}</div>`+
    `<div class="badges" style="margin:8px 0"><span class="b ${r.difficulty}">${r.difficulty}</span>`+
    `<span class="b">${r.box_type}</span></div>`+
    `<div class="skills">${(r.skills||[]).map(esc).join(" · ")}</div>`+md(r.body)+
    `<div class="btns" style="margin-top:16px">`+
    `<a class="act" href="../recipes/${r.slug}.md" download>Download .md</a>`+
    `<button class="act" id="mp">Copy reuse prompt</button></div>`;
  el("mp").onclick=()=>copy(promptFor(r),"prompt copied — paste into Claude in your CTF");
  el("modal").showModal();
}
function render(){
  const fc=el("f-cat").value, fd=el("f-diff").value;
  let rows=DATA.filter(r=>(!fc||r.category===fc)&&(!fd||r.difficulty===fd));
  rows.sort((a,b)=> (a.category||"").localeCompare(b.category||"")
    || (DIFF[a.difficulty]-DIFF[b.difficulty]) || a.title.localeCompare(b.title));
  el("count").textContent=`${rows.length} of ${DATA.length} recipes`;
  const g=el("grid");
  if(!rows.length){g.innerHTML="<div class='empty'>No recipes in this category / difficulty yet.</div>";return;}
  g.innerHTML="";
  rows.forEach(r=>{
    const c=document.createElement("div");c.className="card";
    c.innerHTML=`<div class="cat">${esc(r.category)}</div><h2>${esc(r.title)}</h2>`+
      `<div class="badges"><span class="b ${r.difficulty}">${r.difficulty}</span></div>`+
      `<div class="skills">${(r.skills||[]).map(esc).join(" · ")}</div>`+
      `<div class="btns"><button class="act view">View</button>`+
      `<a class="act" href="../recipes/${r.slug}.md" download>.md</a>`+
      `<button class="act cp">Copy prompt</button></div>`;
    c.querySelector(".view").onclick=()=>openModal(r);
    c.querySelector(".cp").onclick=()=>copy(promptFor(r),"prompt copied");
    g.appendChild(c);
  });
}
["f-cat","f-diff"].forEach(id=>el(id).addEventListener("change",render));
el("m-close").onclick=()=>el("modal").close();
el("modal").addEventListener("click",e=>{if(e.target===el("modal"))el("modal").close();});
fetch("recipes.json").then(r=>r.json()).then(d=>{DATA=d;render();})
  .catch(()=>el("grid").innerHTML="<div class='empty'>recipes.json not found — run ./serve.sh</div>");
</script>
</body></html>
